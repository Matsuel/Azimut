# Stack jetable des tests E2E : PostgreSQL et Kafka seuls, sur des ports distincts du docker-compose de dev.
# Sans volume : chaque `up` repart d'une base et d'un broker vides. Lancé et arrêté par `stack.ts`.
name: azimut-e2e

services:
    postgres:
        image: postgres:17
        environment:
            POSTGRES_USER: trading
            POSTGRES_PASSWORD: trading
            POSTGRES_DB: trading_e2e
        ports:
            - "15432:5432"
        tmpfs:
            - /var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U trading"]
            interval: 2s
            timeout: 5s
            retries: 30

    kafka:
        image: apache/kafka:4.1.0
        ports:
            - "19094:19094"
        environment:
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
            KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19094,CONTROLLER://:9093
            # Le port annoncé à l'hôte doit être celui publié ci-dessus
            KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19094
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
            KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1",
                ]
            interval: 3s
            timeout: 10s
            retries: 40
